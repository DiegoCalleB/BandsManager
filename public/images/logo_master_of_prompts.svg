<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="mopAtmosphere" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#881337" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020204" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="75%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="fireNeon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="lightningCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="metalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lightningGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Atmospheric Background -->
  <rect width="500" height="500" fill="#050508"/>
  <circle cx="250" cy="240" r="240" fill="url(#mopAtmosphere)"/>

  <!-- Background Storm Grid / Circuit Matrix -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="50" y1="250" x2="450" y2="250" stroke-dasharray="8,6"/>
    <line x1="250" y1="50" x2="250" y2="450" stroke-dasharray="8,6"/>
    <circle cx="250" cy="250" r="140" fill="none" stroke-dasharray="4,8"/>
    <circle cx="250" cy="250" r="200" fill="none" stroke-dasharray="2,6"/>
  </g>

  <!-- Metallica-style Cross-Pointers / Puppet Strings of Prompts -->
  <!-- Puppet Master Hands made of Prompt Terminal Syntax '>_' -->
  <path d="M 80,70 L 150,110 L 250,90 L 350,110 L 420,70" fill="none" stroke="url(#lightningCyan)" stroke-width="3" filter="url(#lightningGlow)" opacity="0.85"/>
  <circle cx="80" cy="70" r="4" fill="#38bdf8"/>
  <circle cx="250" cy="90" r="5" fill="#fde047"/>
  <circle cx="420" cy="70" r="4" fill="#38bdf8"/>

  <!-- Vertical Lightning Strings descending to tombstones / servers -->
  <path d="M 80,70 Q 120,200 130,370" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>
  <path d="M 180,100 Q 190,220 200,370" fill="none" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 320,100 Q 310,220 300,370" fill="none" stroke="#fde047" stroke-width="1.5" stroke-opacity="0.7"/>
  <path d="M 420,70 Q 380,200 370,370" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Monoliths / AI Server Crosses (Homage to Master of Puppets Graves) -->
  <g fill="#18181b" stroke="#3f3f46" stroke-width="2">
    <!-- Server 1 Left -->
    <path d="M 110,340 L 150,340 L 155,420 L 105,420 Z" fill="#181825" stroke="#ef4444" stroke-opacity="0.5"/>
    <line x1="115" y1="360" x2="145" y2="360" stroke="#ef4444" stroke-width="1"/>
    <line x1="115" y1="380" x2="145" y2="380" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="120" cy="400" r="2" fill="#ef4444"/>
    <circle cx="128" cy="400" r="2" fill="#22c55e"/>

    <!-- Server 2 Center-Left -->
    <path d="M 180,330 L 220,330 L 225,430 L 175,430 Z" fill="#181825" stroke="#f59e0b" stroke-opacity="0.5"/>
    <line x1="185" y1="355" x2="215" y2="355" stroke="#f59e0b" stroke-width="1"/>
    <line x1="185" y1="375" x2="215" y2="375" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="190" cy="405" r="2" fill="#fde047"/>

    <!-- Server 3 Center-Right -->
    <path d="M 280,330 L 320,330 L 325,430 L 275,430 Z" fill="#181825" stroke="#f59e0b" stroke-opacity="0.5"/>
    <line x1="285" y1="355" x2="315" y2="355" stroke="#f59e0b" stroke-width="1"/>
    <line x1="285" y1="375" x2="315" y2="375" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="290" cy="405" r="2" fill="#fde047"/>

    <!-- Server 4 Right -->
    <path d="M 350,340 L 390,340 L 395,420 L 345,420 Z" fill="#181825" stroke="#ef4444" stroke-opacity="0.5"/>
    <line x1="355" y1="360" x2="385" y2="360" stroke="#ef4444" stroke-width="1"/>
    <line x1="355" y1="380" x2="385" y2="380" stroke="#38bdf8" stroke-width="1"/>
    <circle cx="360" cy="400" r="2" fill="#22c55e"/>
  </g>

  <!-- Epic Central ESP / Gibson Flying V Guitar Silhouette with Dev prompt -->
  <g filter="url(#metalGlow)">
    <!-- Wings of Flying V -->
    <path d="M 250,110 L 295,310 L 335,300 L 250,170 L 165,300 L 205,310 Z" 
          fill="url(#fireNeon)" stroke="url(#metalChrome)" stroke-width="4" stroke-linejoin="miter"/>
    <!-- Guitar Neck with Fretboard -->
    <rect x="246" y="70" width="8" height="150" fill="#27272a" stroke="#71717a" stroke-width="1"/>
    <!-- Headstock Angular Pointy (Metallica style) -->
    <path d="M 244,70 L 240,40 L 250,35 L 260,40 L 256,70 Z" fill="#ef4444" stroke="url(#metalChrome)" stroke-width="2"/>
    <!-- Pickups and Bridge -->
    <rect x="240" y="215" width="20" height="8" rx="2" fill="#09090b" stroke="#71717a" stroke-width="1"/>
    <rect x="240" y="235" width="20" height="8" rx="2" fill="#09090b" stroke="#71717a" stroke-width="1"/>
  </g>

  <!-- METALLICA STYLE LOGO: MASTER OF PROMPTS -->
  <!-- Angular Outer Sharp M and S -->
  <g filter="url(#lightningGlow)">
    <!-- Main Big Typography -->
    <text x="250" y="220" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-size="34" 
          font-weight="900" 
          letter-spacing="4" 
          text-anchor="middle" 
          fill="url(#metalChrome)" 
          stroke="#09090b" 
          stroke-width="5" 
          paint-order="stroke fill">
      MASTER
    </text>
    <text x="250" y="248" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-size="16" 
          font-weight="bold" 
          letter-spacing="8" 
          text-anchor="middle" 
          fill="#fde047" 
          stroke="#000000" 
          stroke-width="3" 
          paint-order="stroke fill">
      OF
    </text>
    <text x="250" y="295" 
          font-family="Impact, 'Arial Black', sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="6" 
          text-anchor="middle" 
          fill="url(#metalChrome)" 
          stroke="#09090b" 
          stroke-width="6" 
          paint-order="stroke fill">
      PROMPTS
    </text>
  </g>

  <!-- Sharp Lightning Flashes across text -->
  <path d="M 70,200 L 115,225 L 95,230 L 140,260" fill="none" stroke="#fde047" stroke-width="3" filter="url(#lightningGlow)"/>
  <path d="M 430,200 L 385,225 L 405,230 L 360,260" fill="none" stroke="#fde047" stroke-width="3" filter="url(#lightningGlow)"/>

  <!-- Subtitle Badge: A Coruña / Thrash Metal Dev -->
  <rect x="110" y="445" width="280" height="24" rx="4" fill="#09090b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="250" y="461" 
        font-family="monospace, Courier" 
        font-size="11" 
        font-weight="bold" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#f43f5e">
    THRASH METAL GALAICO • IA &amp; DEV
  </text>
</svg>
