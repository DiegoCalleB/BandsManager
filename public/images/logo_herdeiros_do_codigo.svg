<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2ca50" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f2ca50"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGlow)"/>

  <!-- Outer Pick / Púa Contour -->
  <path d="M250,35 C380,35 440,110 440,240 C440,360 300,450 250,475 C200,450 60,360 60,240 C60,110 120,35 250,35 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="6" stroke-linejoin="round" />

  <!-- Inner Celtic/Tech Border -->
  <path d="M250,55 C360,55 415,120 415,235 C415,340 290,425 250,450 C210,425 85,340 85,235 C85,120 140,55 250,55 Z" 
        fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Code Braces { } styled as Electric Lightning / Acoustic sound waves -->
  <!-- Left Brace { -->
  <path d="M175,145 C150,145 135,160 135,190 L135,225 C135,238 122,248 108,250 C122,252 135,262 135,275 L135,310 C135,340 150,355 175,355" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Right Brace } -->
  <path d="M325,145 C350,145 365,160 365,190 L365,225 C365,238 378,248 392,250 C378,252 365,262 365,275 L365,310 C365,340 350,355 325,355" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Central Electric Guitar Silhouette with Code Slash </ > -->
  <g transform="translate(250, 240)">
    <!-- Electric Guitar Body & Neck -->
    <path d="M-8,-140 L8,-140 L6,-30 C18,-24 35,-10 38,15 C41,40 25,65 0,75 C-25,65 -41,40 -38,15 C-35,-10 -18,-24 -6,-30 Z" 
          fill="url(#goldGrad)" />
    <!-- Sound Hole / Matrix Core -->
    <circle cx="0" cy="25" r="16" fill="#0d0d14" stroke="#fde047" stroke-width="3" />
    <path d="M-6,25 L6,25 M0,19 L0,31" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Guitar Pickguard Cutout -->
    <path d="M4,-10 C16,0 20,20 12,35 C8,22 2,12 4,-10 Z" fill="#181822" />
    <!-- Volume Knobs -->
    <circle cx="20" cy="48" r="3.5" fill="#fde047" />
    <circle cx="12" cy="58" r="3.5" fill="#fde047" />
    <!-- Guitar Headstock / Clavijero with 6 Tuning Pegs -->
    <path d="M-10,-140 L10,-140 L14,-175 C10,-182 0,-182 -4,-175 L-6,-160 Z" fill="url(#goldGrad)" />
    <circle cx="-13" cy="-168" r="2.5" fill="#38bdf8" />
    <circle cx="-13" cy="-156" r="2.5" fill="#38bdf8" />
    <circle cx="-13" cy="-144" r="2.5" fill="#38bdf8" />
    <circle cx="13" cy="-168" r="2.5" fill="#38bdf8" />
    <circle cx="13" cy="-156" r="2.5" fill="#38bdf8" />
    <circle cx="13" cy="-144" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Typography: OS HERDEIROS DO CÓDIGO -->
  <text x="250" y="375" text-anchor="middle" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff" letter-spacing="2">
    OS HERDEIROS
  </text>
  <text x="250" y="402" text-anchor="middle" font-family="'Inter', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#goldGrad)" letter-spacing="4">
    DO CÓDIGO
  </text>
  <text x="250" y="425" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" letter-spacing="3">
    ROCK BRAVÚ · GALICIA
  </text>
</svg>
