<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="vinylGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#040405" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Vinyl Grooves Graphic -->
  <circle cx="300" cy="300" r="240" fill="url(#vinylGlow)" stroke="#27272a" stroke-width="2"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="#27272a" stroke-width="1.5" stroke-dasharray="4 8"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="300" cy="300" r="150" fill="none" stroke="#27272a" stroke-width="1.5"/>
  <circle cx="300" cy="300" r="120" fill="none" stroke="#52525b" stroke-width="1" stroke-dasharray="8 6"/>

  <!-- Center Vinyl Label -->
  <circle cx="300" cy="300" r="90" fill="#18181b" stroke="url(#accentGrad)" stroke-width="4"/>
  <circle cx="300" cy="300" r="22" fill="#09090b" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="300" cy="300" r="8" fill="#e4e4e7"/>

  <!-- Sound Waves Over Center -->
  <g transform="translate(300, 245)" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round">
    <line x1="-50" y1="-8" x2="-50" y2="8"/>
    <line x1="-40" y1="-14" x2="-40" y2="14"/>
    <line x1="-30" y1="-6" x2="-30" y2="6"/>
    <line x1="-20" y1="-20" x2="-20" y2="20"/>
    <line x1="-10" y1="-12" x2="-10" y2="12"/>
    <line x1="0" y1="-24" x2="0" y2="24"/>
    <line x1="10" y1="-12" x2="10" y2="12"/>
    <line x1="20" y1="-20" x2="20" y2="20"/>
    <line x1="30" y1="-6" x2="30" y2="6"/>
    <line x1="40" y1="-14" x2="40" y2="14"/>
    <line x1="50" y1="-8" x2="50" y2="8"/>
  </g>

  <!-- Typography Top -->
  <text x="300" y="80" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="6">
    SAMPLER EP
  </text>
  <text x="300" y="108" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="4">
    5 TEMAS LIBRES DE DERECHOS · 100% ROYALTY-FREE
  </text>

  <!-- Center Badge Text -->
  <text x="300" y="370" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#a1a1aa" letter-spacing="2">
    BANDMANAGER SOUNDS
  </text>

  <!-- Bottom Details -->
  <text x="300" y="530" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e4e4e7" letter-spacing="1">
    FUNK · INDIE ACÚSTICO · ROCK · SKA POP · ANTHEM
  </text>
  <text x="300" y="555" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" fill="#71717a">
    Audio & Setlists precargados para ensayar y probar la plataforma
  </text>
</svg>
