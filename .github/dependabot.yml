version: 2
updates:
  # 1. Dependencias de Node.js / npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    # Agrupar las dependencias para evitar spam de 20 PRs a la vez
    groups:
      produccion:
        dependency-type: "production"
        update-types: ["patch", "minor"]
      desarrollo:
        dependency-type: "development"
        update-types: ["patch", "minor"]
  # 2. Workflows y acciones de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
