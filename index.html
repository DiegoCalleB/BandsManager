<!doctype html>
<html lang="es" class="overflow-x-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BandManager.io</title>
    <!-- Favicon & Brand Icons -->
    <!-- ?v=4: los favicons son lo más agresivo que cachea el navegador (Chrome/Android
         a veces ni con recarga forzada lo sueltan) - cambiar la URL es lo único que
         garantiza que se vuelva a pedir tras cambiar el icono. Súbelo cada vez que el
         símbolo cambie de verdad. -->
    <link rel="icon" type="image/png" href="/logo_bandmanager_symbol.png?v=4" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=4" />
    <meta name="theme-color" content="#121110" />

    <!-- PWA: instalable desde el móvil -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BandManager.io" />

    <!-- Open Graph Meta Tags (Previsualización en WhatsApp / Telegram / Redes) -->
    <meta property="og:title" content="BandManager.io — Plataforma Integral para Bandas" />
    <meta property="og:description" content="Gestión inteligente de booking, CRM de salas, fans y logística de conciertos." />
    <meta property="og:image" content="/bandmanageriodefinitiva.jpeg" />
    <meta property="og:type" content="website" />
    <!-- Tema: estampa data-theme antes de pintar para evitar el fogonazo
         blanco en la primera carga. Debe ir ANTES del CSS y del bundle.
         Espejo de src/utils/temaEspectro.ts — si cambia el contrato de
         'bm-tema' o los temas válidos, cambia los dos. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('bm-tema');
          if (p !== 'light' && p !== 'dark' && p !== 'classic' && p !== 'system') p = 'light';
          var r = p === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : p;
          document.documentElement.setAttribute('data-theme', r);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Onest:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[var(--bg)] text-[var(--ink)] overflow-x-hidden">
    <div id="root" class="overflow-x-hidden max-w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
